<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Генератор надежных паролей</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
        }
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .custom-range::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #3b82f6;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
            transition: transform 0.1s ease, background-color 0.2s;
        }
        .custom-range::-webkit-slider-thumb:hover {
            transform: scale(1.15);
            background: #60a5fa;
        }
        .toast {
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.27, 1.55);
        }
        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between items-center p-4 sm:p-6 lg:p-8 font-sans">

    <div class="w-full max-w-xl mx-auto my-auto space-y-6">
        
        <!-- Header -->
        <div class="text-center space-y-2">
            <div class="inline-flex items-center justify-center p-3 bg-blue-600/10 text-blue-400 rounded-2xl mb-2 border border-blue-500/20">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                </svg>
            </div>
            <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-white">Генератор паролей</h1>
            <p class="text-slate-400 text-sm sm:text-base">Создает безопасные пароли, проходящие валидацию на 99% сайтов</p>
        </div>

        <div class="glass-panel rounded-2xl p-4 sm:p-6 shadow-xl space-y-6">
            
            <!-- Password Display Box -->
            <div class="relative group">
                <div class="flex items-center justify-between bg-slate-900/80 border border-slate-700/80 rounded-xl px-4 py-3 sm:py-4 transition-all group-hover:border-slate-600">
                    <input type="text" id="passwordOutput" readonly 
                        class="bg-transparent font-mono text-lg sm:text-2xl text-blue-400 tracking-wider w-full focus:outline-none select-all overflow-x-auto pr-2" 
                        placeholder="Генерация..." />
                    
                    <div class="flex items-center gap-1 sm:gap-2 shrink-0">
                        <!-- Regenerate button -->
                        <button id="btnGenerate" title="Сгенерировать новый" 
                            class="p-2.5 text-slate-400 hover:text-white hover:bg-slate-800 rounded-lg transition">
                            <svg class="w-5 h-5 transition-transform active:rotate-180 duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                            </svg>
                        </button>

                        <!-- Copy Button -->
                        <button id="btnCopy" title="Скопировать" 
                            class="flex items-center gap-2 bg-blue-600 hover:bg-blue-500 text-white font-medium px-3.5 py-2 rounded-lg transition shadow-lg shadow-blue-600/25 active:scale-95">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
                            </svg>
                            <span class="hidden sm:inline text-sm">Копировать</span>
                        </button>
                    </div>
                </div>

                <!-- Strength Indicator Bar -->
                <div class="mt-3 space-y-1.5">
                    <div class="flex justify-between items-center text-xs">
                        <span class="text-slate-400">Стойкость:</span>
                        <span id="strengthText" class="font-semibold text-emerald-400">Надежный</span>
                    </div>
                    <div class="h-2 w-full bg-slate-800 rounded-full overflow-hidden flex gap-1 p-0.5">
                        <div id="strengthSegment1" class="h-full w-1/4 rounded-full bg-emerald-500 transition-all duration-300"></div>
                        <div id="strengthSegment2" class="h-full w-1/4 rounded-full bg-emerald-500 transition-all duration-300"></div>
                        <div id="strengthSegment3" class="h-full w-1/4 rounded-full bg-emerald-500 transition-all duration-300"></div>
                        <div id="strengthSegment4" class="h-full w-1/4 rounded-full bg-emerald-500 transition-all duration-300"></div>
                    </div>
                </div>
            </div>

            <div class="space-y-5 pt-2 border-t border-slate-800">
                
                <!-- Length Controls -->
                <div class="space-y-2">
                    <div class="flex justify-between items-center">
                        <label for="lengthRange" class="text-sm font-medium text-slate-300">Длина пароля</label>
                        <div class="flex items-center gap-1 bg-slate-900 border border-slate-700 rounded-lg px-2 py-1">
                            <input type="number" id="lengthInput" min="6" max="64" value="13" 
                                class="w-12 bg-transparent text-center text-sm font-mono text-blue-400 focus:outline-none font-bold">
                            <span class="text-xs text-slate-500">симв.</span>
                        </div>
                    </div>
                    <input type="range" id="lengthRange" min="6" max="64" value="13" class="w-full h-2 bg-slate-800 rounded-lg appearance-none cursor-pointer custom-range">
                </div>

                <div class="space-y-3">
                    <span class="text-sm font-medium text-slate-300 block">Настройки сложности</span>
                    
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <!-- Lowercase -->
                        <label class="flex items-center justify-between p-3 bg-slate-900/50 hover:bg-slate-900/80 border border-slate-800 rounded-xl cursor-pointer transition">
                            <span class="text-sm text-slate-300 flex items-center gap-2">
                                <span class="font-mono text-xs px-1.5 py-0.5 bg-slate-800 text-blue-400 rounded">a-z</span>
                                Строчные буквы
                            </span>
                            <input type="checkbox" id="chkLowercase" checked class="w-4 h-4 rounded text-blue-600 focus:ring-blue-500 bg-slate-800 border-slate-700">
                        </label>

                        <!-- Uppercase -->
                        <label class="flex items-center justify-between p-3 bg-slate-900/50 hover:bg-slate-900/80 border border-slate-800 rounded-xl cursor-pointer transition">
                            <span class="text-sm text-slate-300 flex items-center gap-2">
                                <span class="font-mono text-xs px-1.5 py-0.5 bg-slate-800 text-blue-400 rounded">A-Z</span>
                                Заглавные буквы
                            </span>
                            <input type="checkbox" id="chkUppercase" checked class="w-4 h-4 rounded text-blue-600 focus:ring-blue-500 bg-slate-800 border-slate-700">
                        </label>

                        <!-- Numbers -->
                        <label class="flex items-center justify-between p-3 bg-slate-900/50 hover:bg-slate-900/80 border border-slate-800 rounded-xl cursor-pointer transition">
                            <span class="text-sm text-slate-300 flex items-center gap-2">
                                <span class="font-mono text-xs px-1.5 py-0.5 bg-slate-800 text-blue-400 rounded">0-9</span>
                                Цифры
                            </span>
                            <input type="checkbox" id="chkNumbers" checked class="w-4 h-4 rounded text-blue-600 focus:ring-blue-500 bg-slate-800 border-slate-700">
                        </label>

                        <!-- Symbols -->
                        <label class="flex items-center justify-between p-3 bg-slate-900/50 hover:bg-slate-900/80 border border-slate-800 rounded-xl cursor-pointer transition">
                            <span class="text-sm text-slate-300 flex items-center gap-2">
                                <span class="font-mono text-xs px-1.5 py-0.5 bg-slate-800 text-blue-400 rounded">!@#</span>
                                Спецсимволы
                            </span>
                            <input type="checkbox" id="chkSymbols" class="w-4 h-4 rounded text-blue-600 focus:ring-blue-500 bg-slate-800 border-slate-700">
                        </label>
                    </div>

                    <!-- Additional Option: Avoid Ambiguous Characters -->
                    <label class="flex items-center justify-between p-3 bg-slate-900/30 hover:bg-slate-900/50 border border-slate-800/60 rounded-xl cursor-pointer transition">
                        <span class="text-xs text-slate-400 flex items-center gap-2">
                            <svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                            </svg>
                            Исключить похожие символы <code class="text-slate-300 font-mono">i, l, 1, L, o, 0, O</code>
                        </span>
                        <input type="checkbox" id="chkExcludeSimilar" checked class="w-4 h-4 rounded text-blue-600 focus:ring-blue-500 bg-slate-800 border-slate-700">
                    </label>
                </div>

                <div class="bg-slate-900/40 rounded-xl p-3.5 border border-slate-800/80 space-y-2">
                    <span class="text-xs font-semibold uppercase tracking-wider text-slate-400 block">Соответствие требованиям сайтов:</span>
                    <div class="grid grid-cols-2 gap-2 text-xs">
                        <div id="checkLength" class="flex items-center gap-1.5 text-emerald-400">
                            <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                            <span>Длина ≥ 8 символов</span>
                        </div>
                        <div id="checkUpper" class="flex items-center gap-1.5 text-emerald-400">
                            <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                            <span>Заглавная буква</span>
                        </div>
                        <div id="checkLower" class="flex items-center gap-1.5 text-emerald-400">
                            <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                            <span>Строчная буква</span>
                        </div>
                        <div id="checkDigit" class="flex items-center gap-1.5 text-emerald-400">
                            <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                            <span>Цифра</span>
                        </div>
                    </div>
                </div>

            </div>
        </div>

        <div class="glass-panel rounded-2xl p-4 sm:p-5 shadow-xl space-y-3">
            <div class="flex justify-between items-center">
                <h2 class="text-sm font-semibold text-slate-300">История (последние 10)</h2>
                <button id="btnClearHistory" class="text-xs text-slate-500 hover:text-slate-300 transition">Очистить</button>
            </div>
            <div id="historyList" class="space-y-1.5 text-xs font-mono">
                <!-- History items populated via JavaScript -->
                <p class="text-slate-500 text-center py-2 font-sans text-xs">История пока пуста</p>
            </div>
        </div>

    </div>

    <div id="toast" class="toast fixed bottom-6 left-1/2 -translate-x-1/2 bg-blue-600 text-white text-sm font-medium px-5 py-2.5 rounded-full shadow-2xl flex items-center gap-2 border border-blue-400/30 z-50 pointer-events-none">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
        </svg>
        <span>Пароль скопирован в буфер обмена!</span>
    </div>

    <script>
        const CHAR_SETS = {
            lowercase: 'abcdefghijklmnopqrstuvwxyz',
            uppercase: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
            numbers: '0123456789',
            symbols: '!@#$%^&*()_+-=[]{}|;:,.<>?'
        };

        const SIMILAR_CHARS = /[il1Lo0O]/g;

        let passwordHistory = [];

        // DOM Elements
        const passwordOutput = document.getElementById('passwordOutput');
        const lengthRange = document.getElementById('lengthRange');
        const lengthInput = document.getElementById('lengthInput');
        const chkLowercase = document.getElementById('chkLowercase');
        const chkUppercase = document.getElementById('chkUppercase');
        const chkNumbers = document.getElementById('chkNumbers');
        const chkSymbols = document.getElementById('chkSymbols');
        const chkExcludeSimilar = document.getElementById('chkExcludeSimilar');
        
        const btnGenerate = document.getElementById('btnGenerate');
        const btnCopy = document.getElementById('btnCopy');
        const toast = document.getElementById('toast');
        const historyList = document.getElementById('historyList');
        const btnClearHistory = document.getElementById('btnClearHistory');

        function getRandomInt(max) {
            const array = new Uint32Array(1);
            window.crypto.getRandomValues(array);
            return array[0] % max;
        }

        function generatePassword() {
            let selectedSets = [];

            if (chkLowercase.checked) selectedSets.push({ name: 'lower', chars: CHAR_SETS.lowercase });
            if (chkUppercase.checked) selectedSets.push({ name: 'upper', chars: CHAR_SETS.uppercase });
            if (chkNumbers.checked) selectedSets.push({ name: 'numbers', chars: CHAR_SETS.numbers });
            if (chkSymbols.checked) selectedSets.push({ name: 'symbols', chars: CHAR_SETS.symbols });

            // Fallback if user unchecks everything: auto check lowercase
            if (selectedSets.length === 0) {
                chkLowercase.checked = true;
                selectedSets.push({ name: 'lower', chars: CHAR_SETS.lowercase });
            }

            const excludeSimilar = chkExcludeSimilar.checked;

            // Clean character sets if 'exclude similar' is enabled
            selectedSets = selectedSets.map(set => {
                let cleanedChars = set.chars;
                if (excludeSimilar) {
                    cleanedChars = cleanedChars.replace(SIMILAR_CHARS, '');
                }
                return { name: set.name, chars: cleanedChars };
            }).filter(set => set.chars.length > 0);

            const length = parseInt(lengthRange.value, 10);
            let passwordChars = [];

            // 1. Guarantee at least ONE character from each selected category to pass validation rules
            selectedSets.forEach(set => {
                const randomChar = set.chars[getRandomInt(set.chars.length)];
                passwordChars.push(randomChar);
            });

            // 2. Build combined pool for remaining slots
            const fullPool = selectedSets.map(s => s.chars).join('');

            // 3. Fill the rest of the length
            while (passwordChars.length < length) {
                const randomChar = fullPool[getRandomInt(fullPool.length)];
                passwordChars.push(randomChar);
            }

            // 4. Shuffle result using Fisher-Yates shuffle with crypto randoms
            for (let i = passwordChars.length - 1; i > 0; i--) {
                const j = getRandomInt(i + 1);
                [passwordChars[i], passwordChars[j]] = [passwordChars[j], passwordChars[i]];
            }

            const finalPassword = passwordChars.join('');
            passwordOutput.value = finalPassword;

            updateStrengthMeter(finalPassword);
            updateValidationChecks(finalPassword);
            addToHistory(finalPassword);
        }

        function updateStrengthMeter(password) {
            let score = 0;
            const length = password.length;

            if (length >= 8) score += 1;
            if (length >= 12) score += 1;
            if (length >= 16) score += 1;

            if (/[a-z]/.test(password) && /[A-Z]/.test(password)) score += 1;
            if (/[0-9]/.test(password)) score += 1;
            if (/[^a-zA-Z0-9]/.test(password)) score += 1;

            // Map score to 4 segments
            let level = 1; // 1: Weak, 2: Medium, 3: Good, 4: Excellent
            if (score <= 2) level = 1;
            else if (score <= 4) level = 2;
            else if (score <= 5) level = 3;
            else level = 4;

            const seg1 = document.getElementById('strengthSegment1');
            const seg2 = document.getElementById('strengthSegment2');
            const seg3 = document.getElementById('strengthSegment3');
            const seg4 = document.getElementById('strengthSegment4');
            const strengthText = document.getElementById('strengthText');

            const segments = [seg1, seg2, seg3, seg4];
            
            // Colors and Labels
            const colors = {
                1: { bg: 'bg-red-500', text: 'Слабый', textColor: 'text-red-400' },
                2: { bg: 'bg-amber-500', text: 'Средний', textColor: 'text-amber-400' },
                3: { bg: 'bg-blue-500', text: 'Хороший', textColor: 'text-blue-400' },
                4: { bg: 'bg-emerald-500', text: 'Отличный', textColor: 'text-emerald-400' }
            };

            segments.forEach((seg, idx) => {
                seg.className = 'h-full w-1/4 rounded-full transition-all duration-300 ';
                if (idx < level) {
                    seg.classList.add(colors[level].bg);
                } else {
                    seg.classList.add('bg-slate-800');
                }
            });

            strengthText.textContent = colors[level].text;
            strengthText.className = `font-semibold ${colors[level].textColor}`;
        }

        function updateValidationChecks(password) {
            const hasLength = password.length >= 8;
            const hasUpper = /[A-Z]/.test(password);
            const hasLower = /[a-z]/.test(password);
            const hasDigit = /[0-9]/.test(password);

            updateCheckIcon('checkLength', hasLength, 'Длина ≥ 8 символов');
            updateCheckIcon('checkUpper', hasUpper, 'Заглавная буква');
            updateCheckIcon('checkLower', hasLower, 'Строчная буква');
            updateCheckIcon('checkDigit', hasDigit, 'Цифра');
        }

        function updateCheckIcon(elementId, isValid, labelText) {
            const el = document.getElementById(elementId);
            if (isValid) {
                el.className = 'flex items-center gap-1.5 text-emerald-400';
                el.innerHTML = `<svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg><span>${labelText}</span>`;
            } else {
                el.className = 'flex items-center gap-1.5 text-slate-500 line-through';
                el.innerHTML = `<svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg><span>${labelText}</span>`;
            }
        }

        function copyToClipboard(text) {
            if (!text) return;

            // Fallback for iframe / safe context execution
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            textArea.style.left = "-999999px";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();

            try {
                document.execCommand('copy');
                showToast();
            } catch (err) {
                console.error('Не удалось скопировать', err);
            } finally {
                document.body.removeChild(textArea);
            }
        }

        function showToast() {
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }

        function addToHistory(password) {
            if (passwordHistory.includes(password)) return;
            
            passwordHistory.unshift(password);
            if (passwordHistory.length > 10) {
                passwordHistory.pop();
            }

            renderHistory();
        }

        function renderHistory() {
            if (passwordHistory.length === 0) {
                historyList.innerHTML = `<p class="text-slate-500 text-center py-2 font-sans text-xs">История пока пуста</p>`;
                return;
            }

            historyList.innerHTML = passwordHistory.map((pwd) => `
                <div class="flex items-center justify-between bg-slate-900/60 hover:bg-slate-900 border border-slate-800 rounded-lg px-3 py-1.5 transition">
                    <span class="text-slate-300 truncate mr-2">${escapeHtml(pwd)}</span>
                    <button onclick="copyToClipboard('${escapeHtml(pwd)}')" class="text-slate-400 hover:text-blue-400 p-1 shrink-0" title="Скопировать этот пароль">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
                        </svg>
                    </button>
                </div>
            `).join('');
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        // Sync Range & Number Input
        lengthRange.addEventListener('input', (e) => {
            lengthInput.value = e.target.value;
            generatePassword();
        });

        lengthInput.addEventListener('input', (e) => {
            let val = parseInt(e.target.value, 10);
            if (isNaN(val)) return;
            if (val < 6) val = 6;
            if (val > 64) val = 64;
            lengthRange.value = val;
            generatePassword();
        });

        // Event Listeners for controls
        [chkLowercase, chkUppercase, chkNumbers, chkSymbols, chkExcludeSimilar].forEach(el => {
            el.addEventListener('change', generatePassword);
        });

        btnGenerate.addEventListener('click', generatePassword);

        btnCopy.addEventListener('click', () => {
            copyToClipboard(passwordOutput.value);
        });

        btnClearHistory.addEventListener('click', () => {
            passwordHistory = [];
            renderHistory();
        });

        // Initialize on window load
        window.onload = function() {
            generatePassword();
        };
    </script>
</body>
</html>
